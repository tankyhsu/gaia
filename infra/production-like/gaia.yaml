gaia:
  application:
    name: function-task-production-like
    version: 1.0.0
  profile: production-like
  starters:
    - core-runtime
    - model-mock
    - scenario-runtime
  runtime:
    database_url:
      env: GAIA_POSTGRES_URL
    environment: sandbox
    write_mode: approval_required
    execution:
      provider: temporal
      server_address: temporal:7233
      namespace: gaia-production-like
      task_queue: gaia-production-like
      tls_enabled: false
  stores:
    operational:
      provider: postgres
      auto_create: false
      pool_size: 5
      max_overflow: 10
    checkpoint:
      provider: postgres
      auto_setup: true
      pool_min_size: 1
      pool_max_size: 5
  model:
    provider: mock
    model_id: deterministic-mock
  workflow:
    provider: langgraph
  scenarios:
    modules:
      - examples.function_task.flows
      - examples.function_task.tools
  observability:
    provider: langfuse
    base_url: http://langfuse-web:3000
    public_key:
      env: LANGFUSE_PUBLIC_KEY
    secret_key:
      env: LANGFUSE_SECRET_KEY
    environment: production-like
    sample_rate: 1.0
