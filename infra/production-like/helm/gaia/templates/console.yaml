{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gaia.fullname" . }}-console
  labels:
    {{- include "gaia.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "gaia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      {{- include "gaia.podTemplateMetadata" (dict "root" . "component" "console") | nindent 6 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: "GAIA_API_SERVICE|GAIA_API_KEY"
            - name: NGINX_ENVSUBST_TEMPLATE_DIR
              value: /etc/nginx/templates
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /etc/nginx/conf.d
            - name: GAIA_API_SERVICE
              value: {{ include "gaia.fullname" . }}-api
            - name: GAIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gaia.secretName" . }}
                  key: {{ .Values.secrets.keys.apiKey }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: generated-config
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: templates
          configMap:
            name: {{ include "gaia.fullname" . }}-console
        - name: generated-config
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gaia.fullname" . }}-console
  labels:
    {{- include "gaia.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gaia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}
