server:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 768Mi
  metrics:
    annotations:
      enabled: false
  config:
    logLevel: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal
            connectAddr: temporal-postgres.gaia-platform-product-like.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres-auth
            secretKey: password
            maxConns: 20
            maxIdleConns: 10
            maxConnLifetime: 1h
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal_visibility
            connectAddr: temporal-postgres.gaia-platform-product-like.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres-auth
            secretKey: password
            maxConns: 20
            maxIdleConns: 10
            maxConnLifetime: 1h

web:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

schema:
  useHelmHooks: true
  backoffLimit: 20
  activeDeadlineSeconds: 600

shims:
  dockerize: false
  elasticsearchTool: false
