apiVersion: v1
kind: Service
metadata:
  name: gaia-redis
spec:
  selector:
    app.kubernetes.io/name: gaia-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gaia-redis
spec:
  serviceName: gaia-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gaia-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gaia-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command:
            - sh
            - -c
            - exec valkey-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
