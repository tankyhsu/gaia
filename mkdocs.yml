site_name: Gaia 文档
site_description: Gaia 企业 AI 应用开发与运行框架
site_url: https://tankyhsu.github.io/gaia/
repo_url: https://github.com/tankyhsu/gaia
repo_name: tankyhsu/gaia
edit_uri: edit/main/developer-docs/
docs_dir: developer-docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    scheme: default
    primary: teal
    accent: teal

nav:
  - Gaia 概览: index.md
  - 开始:
      - 从三个 Case 理解 Gaia: try-it.md
      - 选择运行与部署方式: runtime-profiles.md
      - 20 分钟走通 Gaia: getting-started.md
      - 构建一个 Demo: demo.md
      - HR 参考应用: showcase.md
  - 框架:
      - 架构全景图: architecture.md
      - 本地 Production-like 验证: production-like.md
      - 框架怎么工作: developer-guide.md
      - 内部机制: mechanisms.md
      - 安全防护: guardrails.md
      - 基础概念: concepts.md
      - 命令行参考: cli.md
      - Python API: python-api.md
      - HTTP 认证与授权: http-api.md
      - 从其他语言接入: client-sdks.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_section_style: list
            heading_level: 2
            show_root_heading: true
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
