[project]
name = "gaia-framework"
version = "0.1.0"
description = "Application framework and runtime for AI systems"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.27,<1",
  "langgraph>=0.6.11,<0.7",
  "langgraph-checkpoint-sqlite>=3.0.3,<3.1",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  # Temporal is Gaia's only production execution provider. Keep its client and
  # Worker SDK in the base distribution so one installed package can run both
  # in-process development flows and the production API/Worker path.
  "temporalio>=1.10,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres>=3.0.3,<3.1",
  "pgvector>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
]
redis = [
  "redis>=5.2,<9",
]
otel = [
  "opentelemetry-api>=1.28,<2",
]
langfuse = [
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "temporalio[opentelemetry]>=1.10,<2",
]
# Retained so `gaia-framework[temporal]` keeps resolving for anyone who pinned
# it while Temporal was still optional. It now adds nothing to the base install.
temporal = [
  "temporalio>=1.10,<2",
]
presidio = [
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
]
guardrails = [
  "guardrails-ai>=0.6,<1",
]
oidc = [
  "pyjwt[crypto]>=2.9,<3",
]

[project.scripts]
gaia = "gaia.cli.main:main"

[dependency-groups]
dev = [
  "mkdocs-material>=9,<10",
  "mkdocstrings[python]>=0.30,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "temporalio>=1.10,<2",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: requires a real PostgreSQL and pgvector service",
  "redis: requires a real Redis service",
  "external: calls a paid or network-dependent external provider",
  "oidc: requires the pyjwt optional dependency (gaia-framework[oidc])",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/web", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["gaia"]
