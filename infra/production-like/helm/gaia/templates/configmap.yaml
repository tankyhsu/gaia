apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gaia.fullname" . }}-config
  labels:
    {{- include "gaia.labels" . | nindent 4 }}
data:
  gaia.yaml: |
    {{- toYaml .Values.gaia.config | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gaia.fullname" . }}-console
  labels:
    {{- include "gaia.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://${GAIA_API_SERVICE}:8000/;
            proxy_set_header Host ${GAIA_API_SERVICE};
            proxy_set_header X-Gaia-Api-Key ${GAIA_API_KEY};
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
